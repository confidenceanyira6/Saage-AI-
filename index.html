<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Saage AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0B0D14; color: #EDEDEF; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; width: 100%; background: #0B0D14; position: relative; }

    #login { margin: auto; text-align: center; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 340px; }
    .login-logo { width: 96px; height: 96px; border-radius: 28px; background: linear-gradient(135deg, #00D9FF 0%, #7B61FF 50%, #FF3EC9 100%); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 48px; color: #fff; box-shadow: 0 0 48px rgba(123, 97, 255, 0.5); }
    .login-title, .wordmark { font-weight: 800; background: linear-gradient(90deg, #00D9FF, #7B61FF, #FF3EC9); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .login-title { font-size: 32px; margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; color: #9C9CE0; margin-bottom: 20px; }
    #login input { width: 100%; max-width: 280px; background: #161822; border: 1px solid #2A2C3D; border-radius: 10px; padding: 12px 14px; color: #EDEDEF; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
    #login input:focus { border-color: #7B61FF; }
    #unlockBtn { width: 100%; max-width: 280px; background: linear-gradient(90deg, #00D9FF, #7B61FF, #FF3EC9); color: #04040A; border: none; border-radius: 10px; padding: 13px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    #unlockBtn:hover { opacity: 0.9; }
    #loginErr { color: #FF6B6B; font-size: 13px; }

    /* Main chat interface */
    #chat { display: flex; flex-direction: column; height: 100vh; }
    header { padding: 16px; border-bottom: 0.5px solid #22243A; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 700; }
    #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 10px 13px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .row.user .bubble { background: linear-gradient(135deg, #1A2E4A, #241A4A); color: #EDEDEF; }
    .row.ai .bubble { background: #161822; border: 0.5px solid #22243A; }

    /* Input area */
    #inputwrap { padding: 12px; border-top: 0.5px solid #22243A; display: flex; gap: 8px; }
    #input { flex: 1; background: #161822; border: 0.5px solid #2A2C3D; border-radius: 10px; padding: 10px 12px; color: #EDEDEF; font-size: 14px; font-family: inherit; resize: none; outline: none; }
    #input:focus { border-color: #7B61FF; }
    #sendBtn { background: linear-gradient(90deg, #00D9FF, #7B61FF, #FF3EC9); color: #04040A; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
    #sendBtn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="app">
    <div id="login">
      <div class="login-logo">⚡</div>
      <h2 class="login-title">Saage AI</h2>
      <p class="login-subtitle">Your AI-powered portfolio manager</p>
      <input type="password" id="pwd" placeholder="Enter password" />
      <button id="unlockBtn">Unlock</button>
      <div id="loginErr"></div>
    </div>

    <div id="chat" style="display:none">
      <header>
        <h1>Saage AI Chat</h1>
      </header>
      <div id="msgs"></div>
      <div id="inputwrap">
        <input type="text" id="input" placeholder="Type your message..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const pwd = ''; // Set your password here
    const loginDiv = document.getElementById('login');
    const chatDiv = document.getElementById('chat');
    const pwdInput = document.getElementById('pwd');
    const unlockBtn = document.getElementById('unlockBtn');
    const loginErr = document.getElementById('loginErr');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const msgs = document.getElementById('msgs');

    unlockBtn.addEventListener('click', () => {
      if (pwdInput.value === pwd) {
        loginDiv.style.display = 'none';
        chatDiv.style.display = 'flex';
      } else {
        loginErr.textContent = 'Invalid password';
      }
    });

    sendBtn.addEventListener('click', () => {
      if (input.value.trim()) {
        const userMsg = document.createElement('div');
        userMsg.className = 'row user';
        userMsg.innerHTML = `<div class="bubble">${input.value}</div>`;
        msgs.appendChild(userMsg);
        input.value = '';
        msgs.scrollTop = msgs.scrollHeight;
      }
    });

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
</body>
</html>
