<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saage AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0B0D14;color:#EDEDEF;height:100vh;display:flex;flex-direction:column}
  #app{display:flex;flex-direction:column;height:100vh;max-width:720px;margin:0 auto;width:100%}

  /* Brand */
  .brandLogo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#00D9FF 0%,#7B61FF 50%,#FF3EC9 100%);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:#fff;flex-shrink:0;box-shadow:0 0 24px rgba(123,97,255,0.45)}
  .brandWordmark{background:linear-gradient(90deg,#00D9FF,#7B61FF,#FF3EC9);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}

  /* Login screen */
  #login{margin:auto;text-align:center;padding:32px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .loginLogo{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#00D9FF 0%,#7B61FF 50%,#FF3EC9 100%);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:42px;color:#fff;box-shadow:0 0 40px rgba(123,97,255,0.5)}
  .loginTitle{font-size:22px;font-weight:700;letter-spacing:1px}
  #login .inputRow{display:flex;gap:8px;width:100%;max-width:280px}
  #login input{flex:1;background:#161822;border:1px solid #2A2C3D;border-radius:10px;padding:12px 14px;color:#EDEDEF;font-size:14px;font-family:inherit;outline:none}
  #login input:focus{border-color:#7B61FF}
  #unlockBtn{width:100%;max-width:280px;background:linear-gradient(90deg,#00D9FF,#7B61FF,#FF3EC9);color:#04040A;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  #loginErr{color:#FF6B6B;font-size:13px}
  .forgotLink{color:#6B6C8A;font-size:12px;margin-top:6px}

  /* Chat header */
  header{padding:16px;border-bottom:0.5px solid #22243A;display:flex;flex-direction:column;gap:10px}
  .headerTop{display:flex;align-items:center;gap:10px}
  .headerTop h1{font-size:16px;font-weight:700}
  .integrationsRow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .integrationsRow::-webkit-scrollbar{display:none}
  #connectBtn,#githubBtn,#gmailBtn,#facebookBtn,#instagramBtn,#tiktokBtn,#twitterBtn{background:#161822;border:0.5px solid #2A2C3D;color:#EDEDEF;font-size:11px;font-family:inherit;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  #connectBtn.connected,#githubBtn.connected,#gmailBtn.connected,#facebookBtn.connected,#instagramBtn.connected,#tiktokBtn.connected,#twitterBtn.connected{border-color:#00D9FF;color:#00D9FF}

  /* Messages */
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex}
  .row.user{justify-content:flex-end}
  .bubble{max-width:78%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;position:relative}
  .row.user .bubble{background:linear-gradient(135deg,#1A2E4A,#241A4A);color:#EDEDEF}
  .row.ai .bubble{background:#161822;border:0.5px solid #22243A}
  .bubble img{max-width:100%;border-radius:8px;display:block;margin-top:6px}
  .copyBtn{margin-top:6px;background:none;border:none;color:#6B6C8A;font-size:11px;font-family:inherit;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px}
  .copyBtn:hover{color:#9C9CE0}

  /* Input */
  #inputwrap{padding:12px;border-top:0.5px solid #22243A;display:flex;gap:8px}
  #input{flex:1;background:#161822;border:0.5px solid #2A2C3D;border-radius:10px;padding:10px 12px;color:#EDEDEF;font-size:14px;font-family:inherit;resize:none;outline:none}
  #input:focus{border-color:#7B61FF}
  #attachBtn{background:#161822;border:0.5px solid #2A2C3D;color:#8B8C93;border-radius:10px;width:36px;flex-shrink:0;cursor:pointer;font-family:inherit;font-size:16px}
  #send{background:linear-gradient(90deg,#00D9FF,#7B61FF);color:#04040A;border:none;border-radius:10px;padding:0 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  #send:disabled{opacity:0.4}
  .hidden{display:none}

  /* Status/typing indicator */
  .statusBubble{display:flex;align-items:center;gap:8px;padding:10px 13px;font-size:13px;color:#9C9CE0}
  .statusBubble .dots{display:flex;gap:4px}
  .statusBubble .dots span{width:5px;height:5px;border-radius:50%;background:#7B61FF;animation:blink 1.2s infinite}
  .statusBubble .dots span:nth-child(2){animation-delay:0.2s}
  .statusBubble .dots span:nth-child(3){animation-delay:0.4s}
  @keyframes blink{0%,80%,100%{opacity:0.3}40%{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="login">
    <div class="loginLogo">S</div>
    <div class="loginTitle brandWordmark">SAAGE AI</div>
    <div class="inputRow">
      <input id="pw" type="password" placeholder="Enter password">
    </div>
    <button id="unlockBtn">Unlock Saage AI</button>
    <div id="loginErr"></div>
    <div class="forgotLink">Forgot Password? Contact Admin.</div>
  </div>

  <div id="chatView" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <header>
      <div class="headerTop">
        <div class="brandLogo" style="width:32px;height:32px;font-size:16px;border-radius:9px">S</div>
        <h1 class="brandWordmark">Saage AI</h1>
      </div>
      <div class="integrationsRow">
        <button id="connectBtn">Supabase</button>
        <button id="githubBtn">GitHub</button>
        <button id="gmailBtn">Gmail</button>
        <button id="facebookBtn">Facebook</button>
        <button id="instagramBtn">Instagram</button>
        <button id="tiktokBtn">TikTok</button>
        <button id="twitterBtn">X / Twitter</button>
      </div>
    </header>
    <div id="msgs"></div>
    <div id="inputwrap">
      <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.csv,.docx" style="display:none" multiple>
      <button id="attachBtn">+</button>
      <textarea id="input" rows="1" placeholder="Message Saage AI..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://vvwrkdlqestzvvtesyam.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d3JrZGxxZXN0enZ2dGVzeWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjE1NDEsImV4cCI6MjA5OTYzNzU0MX0.nQsnbMmJCts3afMKylTqk2ZzASpvnBWq3vck1QNhQBc";

let sessionToken = null;
let userLabel = null;
let msgs = [];

const loginEl = document.getElementById('login');
const chatViewEl = document.getElementById('chatView');
const pwEl = document.getElementById('pw');
const unlockBtnEl = document.getElementById('unlockBtn');
const loginErrEl = document.getElementById('loginErr');
const msgsEl = document.getElementById('msgs');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');

async function login(){
  const password = pwEl.value.trim();
  if(!password){ loginErrEl.textContent = "Enter your password"; return; }
  loginErrEl.textContent = "";
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/auth`, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY},
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if(!res.ok || !data.token){ loginErrEl.textContent = "Wrong password"; return; }
    sessionToken = data.token;
    userLabel = data.userLabel || 'unknown';
    loginEl.classList.add('hidden');
    chatViewEl.classList.remove('hidden');
    chatViewEl.style.display = 'flex';
    checkConnectedStatus();
  }catch(e){
    loginErrEl.textContent = "Couldn't reach the server";
  }
}

const IMAGE_URL_REGEX = /(https?:\/\/image\.pollinations\.ai\/prompt\/[^\s]+)/;

function render(){
  msgsEl.innerHTML = '';
  msgs.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'row ' + (m.role === 'user' ? 'user' : 'ai');
    const b = document.createElement('div');
    b.className = 'bubble';

    const match = m.content.match(IMAGE_URL_REGEX);
    if(match){
      const textPart = m.content.replace(match[0], '').trim();
      if(textPart){
        const textNode = document.createElement('div');
        textNode.textContent = textPart;
        b.appendChild(textNode);
      }
      const img = document.createElement('img');
      img.src = match[0];
      img.alt = 'Generated image';
      b.appendChild(img);
    } else {
      const textNode = document.createElement('div');
      textNode.textContent = m.content;
      b.appendChild(textNode);
    }

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copyBtn';
    copyBtn.textContent = '⧉ Copy';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(m.content).then(() => {
        copyBtn.textContent = '✓ Copied';
        setTimeout(() => { copyBtn.textContent = '⧉ Copy'; }, 1500);
      });
    });
    b.appendChild(copyBtn);

    row.appendChild(b);
    msgsEl.appendChild(row);
  });
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

const fileInputEl = document.getElementById('fileInput');
const attachBtnEl = document.getElementById('attachBtn');
let pendingFiles = [];
attachBtnEl.addEventListener('click', () => fileInputEl.click());
fileInputEl.addEventListener('change', () => { pendingFiles = Array.from(fileInputEl.files); });

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Cosmetic only — mirrors the backend's intent detection so the status
// label reflects what's actually about to happen. The real decision is
// still made server-side; this just avoids a generic spinner every time.
function detectStatusLabel(text, hasImages){
  const lower = text.toLowerCase();
  if(hasImages && /\b(build|create|make|clone)\b.{0,50}\b(this app|this design|this page|this site|this ui|this website|everything)\b/i.test(text)){
    return { icon: '⚙️', label: 'Building your app and pushing to GitHub…' };
  }
  if(!hasImages && /\b(generate|create|make|draw|design)\b.{0,40}\b(an?\s+image|a\s+picture|a\s+photo|a\s+logo|an?\s+icon|an?\s+illustration|artwork)\b/i.test(text)){
    return { icon: '🎨', label: 'Generating your image…' };
  }
  if(!hasImages && /\b(search|look up|google|find out|verify|check|research|current|latest|today|right now|this week|news|score|price of|compare|comparison|recommend)\b/i.test(lower)){
    return { icon: '🌐', label: 'Searching the web…' };
  }
  return { icon: '🧠', label: 'Thinking…' };
}

async function send(){
  const text = inputEl.value.trim();
  if(!text && !pendingFiles.length) return;
  const fileNames = pendingFiles.map(f => f.name).join(', ');
  msgs.push({role:'user', content: text + (fileNames ? ` [attached: ${fileNames}]` : '')});
  inputEl.value = '';
  sendEl.disabled = true;
  render();

  const attachments = await Promise.all(pendingFiles.map(async f => ({
    mediaType: f.type,
    base64: await fileToBase64(f)
  })));
  const hadImages = attachments.some(a => a.mediaType.startsWith('image/'));
  pendingFiles = [];

  const status = detectStatusLabel(text, hadImages);
  const statusRow = document.createElement('div');
  statusRow.className = 'row ai';
  statusRow.id = 'statusRow';
  statusRow.innerHTML = `<div class="bubble statusBubble">${status.icon} ${status.label} <span class="dots"><span></span><span></span><span></span></span></div>`;
  msgsEl.appendChild(statusRow);
  msgsEl.scrollTop = msgsEl.scrollHeight;

  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/chat`, {
      method: 'POST',
      headers: {
        'Content-Type':'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${sessionToken}`
      },
      body: JSON.stringify({ messages: msgs, attachments })
    });
    const data = await res.json();
    msgs.push({role:'assistant', content: data.reply || '(no response)'});
  }catch(e){
    msgs.push({role:'assistant', content: 'Something went wrong — try again.'});
  }
  document.getElementById('statusRow')?.remove();
  sendEl.disabled = false;
  render();
}

unlockBtnEl.addEventListener('click', login);
pwEl.addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

const connectBtnEl = document.getElementById('connectBtn');
connectBtnEl.addEventListener('click', () => { window.location.href = `${SUPABASE_URL}/functions/v1/supabase-oauth?action=start`; });

const githubBtnEl = document.getElementById('githubBtn');
githubBtnEl.addEventListener('click', () => { window.location.href = `${SUPABASE_URL}/functions/v1/github-oauth?action=start`; });

const gmailBtnEl = document.getElementById('gmailBtn');
gmailBtnEl.addEventListener('click', () => { window.location.href = `${SUPABASE_URL}/functions/v1/gmail-oauth?action=start`; });

const facebookBtnEl = document.getElementById('facebookBtn');
facebookBtnEl.addEventListener('click', () => { window.location.href = `${SUPABASE_URL}/functions/v1/meta-oauth?action=start`; });

const instagramBtnEl = document.getElementById('instagramBtn');
instagramBtnEl.addEventListener('click', () => { window.location.href = `${SUPABASE_URL}/functions/v1/meta-oauth?action=start`; });

const tiktokBtnEl = document.getElementById('tiktokBtn');
tiktokBtnEl.addEventListener('click', () => { window.location.href = `${SUPABASE_URL}/functions/v1/tiktok-oauth?action=start`; });

const twitterBtnEl = document.getElementById('twitterBtn');
twitterBtnEl.addEventListener('click', () => { window.location.href = `${SUPABASE_URL}/functions/v1/twitter-oauth?action=start`; });

async function checkConnectedStatus(){
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/connection-status`, { headers: {'apikey': SUPABASE_ANON_KEY} });
    const data = await res.json();
    if(data.connected){ connectBtnEl.textContent = 'Supabase ✓'; connectBtnEl.classList.add('connected'); }
    if(data.githubConnected){ githubBtnEl.textContent = data.githubUsername ? `GitHub: ${data.githubUsername}` : 'GitHub ✓'; githubBtnEl.classList.add('connected'); }
    if(data.gmailConnected){ gmailBtnEl.textContent = data.gmailEmail ? `Gmail: ${data.gmailEmail}` : 'Gmail ✓'; gmailBtnEl.classList.add('connected'); }
    if(data.metaConnected && data.facebookPageName){ facebookBtnEl.textContent = `FB: ${data.facebookPageName}`; facebookBtnEl.classList.add('connected'); }
    if(data.metaConnected && data.instagramUsername){ instagramBtnEl.textContent = `IG: ${data.instagramUsername}`; instagramBtnEl.classList.add('connected'); }
    if(data.tiktokConnected){ tiktokBtnEl.textContent = data.tiktokUsername ? `TikTok: ${data.tiktokUsername}` : 'TikTok ✓'; tiktokBtnEl.classList.add('connected'); }
    if(data.twitterConnected){ twitterBtnEl.textContent = data.twitterUsername ? `X: @${data.twitterUsername}` : 'X ✓'; twitterBtnEl.classList.add('connected'); }
  }catch(e){ /* buttons stay default */ }
}

const params = new URLSearchParams(window.location.search);
if(params.get('connected') === 'true'){ connectBtnEl.textContent = 'Supabase ✓'; connectBtnEl.classList.add('connected'); }
if(params.get('github_connected') === 'true'){ githubBtnEl.textContent = 'GitHub ✓'; githubBtnEl.classList.add('connected'); }
if(params.get('gmail_connected') === 'true'){ gmailBtnEl.textContent = 'Gmail ✓'; gmailBtnEl.classList.add('connected'); }
if(params.get('meta_connected') === 'true'){ facebookBtnEl.textContent = 'Facebook ✓'; facebookBtnEl.classList.add('connected'); instagramBtnEl.textContent = 'Instagram ✓'; instagramBtnEl.classList.add('connected'); }
if(params.get('tiktok_connected') === 'true'){ tiktokBtnEl.textContent = 'TikTok ✓'; tiktokBtnEl.classList.add('connected'); }
if(params.get('twitter_connected') === 'true'){ twitterBtnEl.textContent = 'X ✓'; twitterBtnEl.classList.add('connected'); }
</script>
</body>
</html>
